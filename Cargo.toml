[package]
name = "calculator-api"
version = "0.1.0"
edition = "2021"
description = "A simple calculator REST API"

[[bin]]
name = "calculator-api"
path = "src/main.rs"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
actix-rt = "2"
